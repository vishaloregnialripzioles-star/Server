name: Fix games.ts syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch games.ts and remove temporary workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('artifacts/discord-bot/src/commands/games.ts')
          s = p.read_text()
          old = ".setStyle(action==='protect'?ButtonStyle.Success:ButtonStyle.Primary)));}"
          new = ".setStyle(action==='protect'?ButtonStyle.Success:ButtonStyle.Primary))));}"
          if old not in s:
              raise SystemExit('Expected games.ts syntax pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/fix-games-syntax.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/discord-bot/src/commands/games.ts .github/workflows/fix-games-syntax.yml
          git commit -m "fix: repair games.ts syntax"
          git push

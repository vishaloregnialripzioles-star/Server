services:
  - type: web
    name: voidy-moderation-bot
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install -g pnpm@10 && pnpm install --no-frozen-lockfile
    # Register commands with the same application before starting the gateway client.
    # DISCORD_GUILD_ID makes updates appear immediately in the target server.
    startCommand: pnpm --filter @workspace/discord-bot run deploy && pnpm --filter @workspace/discord-bot run start
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.20.0
